bundle:
  name: retail-data-platform
  engine: direct

experimental:
  skip_name_prefix_for_schema: true

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog

  bronze_schema:
    description: Bronze schema for CSV ingestion
    default: blob_bronze

  silver_schema:
    description: Silver schema
    default: retail_silver

  gold_schema:
    description: Gold schema
    default: retail_gold

  quarantine_schema:
    description: Schema for quarantined records
    default: retail_quarantine

  ai_schema:
    description: Schema for AI and RAG resources
    default: retail_ai

  volume_schema:
    description: Schema containing Unity Catalog volumes
    default: volumes

  blob_volume:
    description: Volume containing CSV source files
    default: blob_source

  pdf_volume:
    description: Volume containing RAG PDF documents
    default: retail_knowledge

  postgres_pipeline_id:
    description: Existing PostgreSQL Lakeflow Connect pipeline ID

  salesforce_pipeline_id:
    description: Existing Salesforce Lakeflow Connect pipeline ID

  genie_warehouse_id:
    description: SQL Warehouse used by the Genie Space

  genie_parent_path:
    description: Workspace folder for the Genie Space

  genie_file_path:
    description: Genie Space definition file


targets:
  dev:
    default: true

    presets:
      name_prefix: ""

    workspace:
      host: https://dbc-c04a5ad1-7844.cloud.databricks.com

    variables:
      catalog: dbr_dev
      genie_warehouse_id: 1a8ff5cbf85f90de
      genie_parent_path: /Workspace/Users/yanquiel.arango@gmail.com
      genie_file_path: ../src/genie/retail_sales_and_customer_analytics.dev.geniespace.json
      postgres_pipeline_id: c9e7e6e4-3304-4702-9692-6488eb75df2a
      salesforce_pipeline_id: 2d5762da-9458-47c5-b224-c24459f163ad

  prod:
    mode: production

    workspace:
      host: https://adb-7405615123305702.2.azuredatabricks.net
      root_path: /Workspace/retail-data-platform-prod/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: dbr_dev_trial
      genie_warehouse_id: c0152a553a7a830f
      genie_parent_path: /Workspace/Users/yanquiel@softserve.academy
      genie_file_path: ../src/genie/retail_sales_and_customer_analytics.prod.geniespace.json
      postgres_pipeline_id: a7f85588-89fc-4b05-b47d-469b17e33875
      salesforce_pipeline_id: cf4e9b76-7e62-4a10-b4a0-e60e8537cc28