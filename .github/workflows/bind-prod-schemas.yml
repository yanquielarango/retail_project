name: Discover PROD Resources

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  discover_prod_resources:
    name: Discover existing PROD resources
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST: https://adb-7405604503619901.1.azuredatabricks.net
      DATABRICKS_AUTH_TYPE: github-oidc-azure
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify PROD identity
        working-directory: /tmp
        run: databricks current-user me

      - name: List PROD jobs
        working-directory: /tmp
        run: databricks jobs list -o json

      - name: List PROD pipelines
        working-directory: /tmp
        run: databricks pipelines list-pipelines -o json

      - name: List PROD apps
        working-directory: /tmp
        run: databricks apps list -o json

      - name: List PROD experiments
        working-directory: /tmp
        run: databricks experiments list-experiments --view-type ALL -o json

      - name: List PROD Vector Search endpoints
        working-directory: /tmp
        run: databricks vector-search-endpoints list-endpoints -o json

      - name: List indexes from PROD RAG endpoint
        working-directory: /tmp
        run: databricks vector-search-indexes list-indexes prod-retail-rag-endpoint -o json

      - name: Confirm bundle state
        run: databricks bundle plan -t prod