name: Retail Data Platform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install unit test dependencies
        run: uv sync --only-group unit --frozen

      - name: Run unit tests
        run: uv run --only-group unit pytest tests/unit -m unit

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks bundle
        run: databricks bundle validate -t dev
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy_dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to DEV
        run: databricks bundle deploy -t dev

      - name: Run DEV data workflow
        run: databricks bundle run retail_workflow -t dev

  integration_tests_dev:
    name: Integration tests on DEV
    runs-on: ubuntu-latest
    needs: deploy_dev
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install integration test dependencies
        run: uv sync --frozen

      - name: Run integration tests
        run: uv run pytest tests/integration -m integration

  rag_refresh_dev:
    name: Refresh RAG on DEV
    runs-on: ubuntu-latest
    needs: integration_tests_dev
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      RAG_INDEX_NAME: dbr_dev.retail_ai.rag_index

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Build RAG source
        run: databricks bundle run rag_build_source -t dev

      - name: Get AI Search pipeline context
        run: |
          PIPELINE_ID=$(databricks vector-search-indexes get-index "$RAG_INDEX_NAME" -o json | jq -r '.delta_sync_index_spec.pipeline_id')
          PREVIOUS_UPDATE_ID=$(databricks pipelines get "$PIPELINE_ID" -o json | jq -r '.latest_updates[0].update_id // empty')

          echo "RAG_PIPELINE_ID=$PIPELINE_ID" >> "$GITHUB_ENV"
          echo "PREVIOUS_RAG_UPDATE_ID=$PREVIOUS_UPDATE_ID" >> "$GITHUB_ENV"

      - name: Sync AI Search index
        run: databricks vector-search-indexes sync-index "$RAG_INDEX_NAME"

      - name: Wait for AI Search sync
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            PIPELINE_JSON=$(databricks pipelines get "$RAG_PIPELINE_ID" -o json)

            UPDATE_ID=$(echo "$PIPELINE_JSON" | jq -r '.latest_updates[0].update_id // empty')
            STATE=$(echo "$PIPELINE_JSON" | jq -r '.latest_updates[0].state // empty')

            if [[ -n "$UPDATE_ID" && "$UPDATE_ID" != "$PREVIOUS_RAG_UPDATE_ID" ]]; then
              echo "AI Search sync update: $UPDATE_ID - $STATE"

              case "$STATE" in
                COMPLETED)
                  exit 0
                  ;;
                FAILED|CANCELED)
                  echo "AI Search sync failed with state: $STATE"
                  exit 1
                  ;;
              esac
            else
              echo "Waiting for the new AI Search sync to start..."
            fi

            sleep 10
          done

          echo "Timed out waiting for AI Search sync"
          exit 1

  rag_deploy_dev:
    name: Deploy RAG app to DEV
    runs-on: ubuntu-latest
    needs: rag_refresh_dev
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy RAG app
        run: databricks bundle run retail_rag_assistant -t dev