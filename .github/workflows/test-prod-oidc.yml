name: Test PROD OIDC

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/github-actions-workflows

permissions:
  id-token: write
  contents: read

jobs:
  test_prod_oidc:
    name: Test PROD OIDC
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: github-oidc-azure
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Show target workspace
        run: echo "DATABRICKS_HOST=$DATABRICKS_HOST"

      - name: Verify authentication configuration
        run: databricks auth describe

      - name: Verify Databricks authentication
        run: databricks current-user me