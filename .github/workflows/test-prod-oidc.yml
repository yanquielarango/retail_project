name: Test PROD OIDC

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/github-actions-workflows

permissions:
  id-token: write
  contents: read

jobs:
  test_prod_oidc:
    name: Test PROD OIDC
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_AUTH_TYPE: github-oidc-azure
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify PROD authentication configuration
        run: databricks auth describe --host https://adb-7405604503619901.1.azuredatabricks.net

      - name: Verify PROD Databricks authentication
        run: databricks current-user me -t prod