resources:
  jobs:
    retail_workflow:
      name: ${bundle.target}-retail-workflow

      tasks:
        # --------------------------------
        # Bronze ingestion - parallel
        # --------------------------------

        - task_key: ingest_salesforce
          pipeline_task:
            pipeline_id: ${var.salesforce_pipeline_id}

        - task_key: ingest_postgres
          pipeline_task:
            pipeline_id: ${var.postgres_pipeline_id}

        - task_key: ingest_transactions
          notebook_task:
            notebook_path: ../notebooks/blob_to_bronze.ipynb

        # --------------------------------
        # Silver
        # --------------------------------

        - task_key: silver_pipeline
          depends_on:
            - task_key: ingest_salesforce
            - task_key: ingest_postgres
            - task_key: ingest_transactions

          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_pipeline.id}

        # --------------------------------
        # DQX
        # --------------------------------

        - task_key: dqx
          depends_on:
            - task_key: silver_pipeline

          spark_python_task:
            python_file: ../src/quality/run_dqx.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--silver-schema"
              - "${var.silver_schema}"
              - "--quarantine-schema"
              - "${var.quarantine_schema}"

          environment_key: dqx_env

        # --------------------------------
        # Gold
        # --------------------------------

        - task_key: gold_pipeline
          depends_on:
            - task_key: dqx

          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}

      environments:
        - environment_key: dqx_env
          spec:
            environment_version: "2"
            dependencies:
              - databricks-labs-dqx==0.9.3