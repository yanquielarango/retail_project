resources:
  jobs:
    rag_build_source:
      name: ${bundle.target}-rag-build-source

      tasks:
        - task_key: build_rag_source
          spark_python_task:
            python_file: ../src/rag/build_rag_source.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "3"